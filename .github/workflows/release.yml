name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify version and checks
        shell: pwsh
        run: |
          $version = (Get-Content crates/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match application version' }
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --release -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --workspace --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.sig release/*.sha256 release/latest.json --verify-tag --title "消息面分析 $env:GITHUB_REF_NAME" --generate-notes
