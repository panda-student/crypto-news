{% extends "base.html" %}
{% block title %}密钥{% endblock %}
{% block body %}
<h1>密钥</h1>
{% if error %}<p class="note">{{ error }}</p>{% else %}
<p class="muted">密钥加密保存，页面不会显示已保存的值。保存同名键会覆盖原值。</p>
<table>
<thead><tr><th>键</th><th>状态</th><th>更新时间</th><th>保存</th><th>删除</th></tr></thead>
<tbody>
{% for s in secrets %}{% include "secret_row.html" %}{% endfor %}
</tbody>
</table>
{% endif %}
{% endblock %}
