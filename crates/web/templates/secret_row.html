<tr>
<td>{{ s.key }}</td>
<td>{% if s.configured %}<span class="s-ok">已配置</span>{% else %}<span class="muted">未配置</span>{% endif %}</td>
<td>{% if s.updated_at %}{{ s.updated_at }}{% else %}-{% endif %}</td>
<td><form class="inline" hx-post="/api/v1/secrets" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="key" value="{{ s.key }}"><input type="password" name="value" autocomplete="off" placeholder="输入新值" required> <button class="primary" type="submit">保存</button></form></td>
<td>{% if s.configured %}<form class="inline" hx-post="/api/v1/secrets/delete" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="确定删除该密钥？"><input type="hidden" name="key" value="{{ s.key }}"><button type="submit">删除</button></form>{% endif %}</td>
</tr>
