{% if flash %}<div class="fl{% if not flash_ok %} bad{% endif %}">{{ flash }}</div>{% endif %}
{% if error %}<p class="note">{{ error }}</p>{% else %}
<div class="grid">
<form class="cd fm" hx-post="/settings/system/app" hx-trigger="change" hx-target="#sec-sys" hx-swap="innerHTML">
<label class="settings-row"><span><b>开机自启</b><small>登录系统后自动启动应用</small></span><input class="settings-toggle" type="checkbox" name="autostart" role="switch" aria-label="开机自启" value="on"{% if autostart %} checked{% endif %}{% if not desktop %} disabled{% endif %}></label>
<label class="settings-row"><span><b>关闭窗口时缩到托盘</b><small>保留后台采集和消息推送</small></span><input class="settings-toggle" type="checkbox" name="close_to_tray" role="switch" aria-label="关闭窗口时缩到托盘" value="on"{% if close_to_tray %} checked{% endif %}{% if not desktop %} disabled{% endif %}></label>
{% if not desktop %}<div class="mu mini">仅桌面版可用。</div>{% endif %}
</form>
<div class="cd"><div class="hd"><b>应用更新</b><span class="mu mini">当前版本 {{ version }}</span></div>
<label class="settings-row"><span><b>自动检查更新</b><small>发现新版本后提示，安装前保留确认入口</small></span><input class="settings-toggle" type="checkbox" name="enabled" role="switch" aria-label="自动检查更新" value="true"{% if auto_update %} checked{% endif %} hx-post="/settings/system/auto-update" hx-vals='js:{enabled:event.target.checked}' hx-target="#sec-sys" hx-swap="innerHTML"{% if not desktop %} disabled{% endif %}></label>
<div class="ft"><span data-update-status class="mu mini" role="status">正在读取更新状态…</span><span style="flex:1"></span><button type="button" hx-post="/settings/system/update" hx-vals='{"action":"check"}' hx-target="#sec-sys" hx-swap="innerHTML"{% if not desktop %} disabled{% endif %}>检查更新</button><button type="button" class="primary" data-update-install hx-post="/settings/system/update" hx-vals='{"action":"install"}' hx-confirm="确认下载、校验并安装更新？应用将退出并重新启动。" hx-target="#sec-sys" hx-swap="innerHTML" hidden>安装更新</button></div></div>
</div>{% endif %}
