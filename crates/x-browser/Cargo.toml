[package]
license = "Apache-2.0"
name = "x-browser"
version = "0.1.0"
edition = "2021"
publish = false
description = "X 账号时间线采集：本机浏览器 + 用户自己的登录态"

[dependencies]
plugin-sdk = { path = "../plugin-sdk" }
chromiumoxide = { version = "0.9", default-features = false }
futures-util = { version = "0.3", default-features = false }
scraper = { version = "0.20", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["time", "sync", "rt", "process"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
store = { path = "../store" }
